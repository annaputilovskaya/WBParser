[project]
name = "wbparser"
version = "0.1.0"
description = "Парсер данных с Wildberries"
authors = [
    {name = "Anna_Putilovskaya",email = "putilovakayaa@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "seleniumbase (>=4.48.2,<5.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "pydantic (>=2.10.4)",
    "pydantic-settings (>=2.7.0,<3.0.0)",
    "fake-useragent (>=1.5.1,<2.0.0)",
    "python-json-logger (>=3.2.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "ruff (>=0.17.0,<1.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "allow_network: разрешает реальный сетевой доступ в тесте",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
extend-exclude = [".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "RET", "PIE", "LOG", "TRY"]
ignore = [
    "E501",    # длинные строки (docstrings/URL) контролирует formatter
    "TRY003",  # осознанные длинные сообщения исключений (валидация env)
    "TRY300",  # return внутри try — не раздуваем обработку HTTP-запросов
    "RUF001",  # неоднозначные символы: проект русскоязычный (кириллица в строках)
    "RUF002",  # неоднозначные символы: русские docstrings
    "RUF003",  # неоднозначные символы: русские комментарии
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
